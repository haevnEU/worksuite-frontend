<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <!-- Exakter blauer Farbverlauf deines WorkTool-Icons -->
        <linearGradient id="worktoolBlue" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
    </defs>

    <!-- Abgerundetes Icon-Badge (Squircle) -->
    <rect width="64" height="64" rx="18" fill="url(#worktoolBlue)" />

    <!-- Weißes, fettes "W" im Font-/Icon-Stil der App -->
    <text
        x="32"
        y="46"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="40"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-1"
    >W</text>
</svg>
